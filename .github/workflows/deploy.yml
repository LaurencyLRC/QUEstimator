# .github/workflows/deploy.yml
#
# Build + deploy ONLY — no MCMC/pipeline step, no data refresh.
# The GRM pipeline (scripts/pipeline.py) and any data refresh are run LOCALLY
# (e.g. on your Ryzen, where it converges in ~3 h with 0 divergences). Commit
# the generated public/data/*.json and push; this workflow builds the static
# site from those committed files and deploys to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify dashboard data is committed
        run: |
          set -e
          for f in charts.json level-summary.json meta.json players.json; do
            if [ ! -f "public/data/$f" ]; then
              echo "ERROR: public/data/$f is missing."
              echo "Run scripts/pipeline.py locally, then commit public/data/*.json before pushing."
              exit 1
            fi
          done
          echo "All dashboard JSON files present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build static export
        run: bun run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          set -e
          if [ ! -d "out" ]; then
            echo "ERROR: out/ directory was not created"
            exit 1
          fi
          echo "out/ exists with $(ls out/ | wc -l) entries"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
