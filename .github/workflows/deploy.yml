# .github/workflows/deploy.yml
#
# Build + verify + deploy ONLY — no MCMC calibration or live scraping in CI.
# Data refreshes and Bayesian GRM calibration run LOCALLY via scripts/update_all.py
# (using the native C11 + OpenMP NUTS engine in native/, ~14 min with 0 divergences).
# Commit the generated public/data/*.json and push; this workflow validates the data,
# type-checks, tests, builds the static export, and deploys to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify dashboard data is committed
        run: |
          set -e
          for f in charts.json level-summary.json meta.json players.json sha512-to-id.json; do
            if [ ! -f "public/data/$f" ]; then
              echo "ERROR: public/data/$f is missing."
              echo "Run scripts/update_all.py locally, then commit public/data/*.json before pushing."
              exit 1
            fi
          done
          echo "All dashboard JSON files present."

      - name: Run post-calibration data smell tests
        run: python3 scripts/verify_data.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Type-check, lint, and test
        run: |
          bunx tsc --noEmit
          bun run lint
          bun test

      - name: Build static export
        run: bun run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          set -e
          if [ ! -d "out" ]; then
            echo "ERROR: out/ directory was not created"
            exit 1
          fi
          echo "out/ exists with $(ls out/ | wc -l) entries"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
